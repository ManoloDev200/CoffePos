<!DOCTYPE html>
<html lang = "es" style = "height: 100%; width: 100%; margin: 0; padding: 0;">
  <head>
    <meta charset = "UTF-8">
    <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
    <title>Pagina Inicial</title>
    <link rel = "stylesheet" href = "css/login.css">

  </head>

  <body>

    <div class="pagina-login">
    
    <div class="columna-izquierda">
      <div class="Contenedor_logo" style="
        filter: brightness(1.4) contrast(1.2); 
        mix-blend-mode: multiply;">
        <img src="Imagenes/logo_coffePos.jpg" alt="Logo de la empresa" class="Logo_empresa">
      </div>
    </div>
    

    <div class="columna-derecha">

      <div class="Contenedor_bienvenida">
          <p class="Mensaje_bienvenida">Hola bienvenido!</p>
      </div>

      <div class="Contenedor_formulario">

        <div class="Contenedor_logo_secundario" style=
          "display: flex;
          justify-content: center;
          align-items: center;">
          <img src="Imagenes/logo_secundario.jpg" alt="Logo Secundario" class="logo_secundario">
        </div>
      <div class="formulario_login">
        <form  action="login.php" method="POST">
          
          <div class="usuario">
            <input type="text" name="usuario" placeholder="Usuario" required>
          </div>

          <div class="contraseña">
            <input type="password" name="contraseña" placeholder="Contraseña" required>
          </div>

          <div class="recordar-contraseña">
            <input type="checkbox" name="recordar" id="recordar">
            <label for="recordar">Recordar Contraseña</label>

          </div>
            
          <div class ="iniciar-sesion">
            <button type="submit">Iniciar Sesión</button>
          </div>
          
          <div class ="or-login" 
            style
            ="margin-bottom: 20px;
              margin-top: 20px; font-size: 16px;
              color:rgb(0, 152, 101);
              font-weight: bold;
              font-family: 'Arial', sans-serif;
              text-align: center;
              ">
            <span> O iniciar sesión en</span>
          </div>

          <div class="redes-sociales">
            <button type="button" class="btn-red-social">
              <img src="Imagenes/facebook_logo.png" alt="Facebook" class="boton-facebook">
            </button>
            <button type="button" class="btn-red-social">
              <img src="Imagenes/google_logo.png" alt="Google" class="boton-google">
            </button>
          </div>

        </form>
      </div>

      </div>

    </div>
  </div>
    

  </body>

</html>
